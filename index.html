<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>算术题</title>
</head>
<style>
    body {
        background-size: cover;
        background-repeat: no-repeat;
    }

    .paper {
        width: 90%;
        height: 90%;
        border: 10px solid gray;
        margin: auto;
        background: #FFFFFF;
    }

    .Title {
        text-align: center;
        font-family: 楷体;
        font-size: 40px;
        width: 90%;
        margin-top: 10px;
        margin-right: auto;
        margin-left: auto;
    }

    .countTypeSelect {
        width: 90%;
        margin-top: 10px;
        margin-left: auto;
        margin-right: auto;
    }

    .questions {
        width: 90%;
        height: 600px;
        margin-top: 10px;
        margin-left: auto;
        margin-right: auto;
        border: 1px dashed #F00;
    }

    .p1 {
        margin-top: 10px;
        height: 350px;
        float: left;
        width: 100%;
        border: none;
    }

    .problem {
        width: 100%;
        height: 70px;
        border: 0px;
        margin-top: 10px;
        margin-left: 50px;
    }

    .countTypeItem {
        margin-left: 30px;
    }

    .numberInput {
        width: 100px;
        height: 30px;
        border: 1px solid deepskyblue;
        margin-left: 5px;
        text-align: center;
        font-size: 20px;
    }

    .calButton {
        width: 180px;
        margin-left: 5px;
        font-size: 18px;
        font-family: 幼圆;
        color: cornflowerblue;
    }
    .answer {
        width: 180px;
        margin-left: 5px;
        font-size: 18px;
        font-family: 幼圆;
        font-weight:bold;
    }





    input[type="radio"] {
        /* Example style */
        transform: scale(2);
        margin-right: 10px;
    }

</style>
<body>
<div class="paper" id="paper">
    <h1 class="Title" style="margin-left: 20px;">算术题：在方框里填入不重复的1-9的数字，使得等式成立</h1>
    <table class="countTypeSelect">
        <tr class="countTypeTr">
            <td>

                <input type="radio" value="0" name="countType" id="option0" checked="checked"><label for="option0">🟨➕🟨➕🟨➕🟨</label>

            </td>

            <td>

                <input type="radio" value="1"  id="option1" name="countType"><label for="option1">🟨➕🟨➖🟨➕🟨</label>

            </td>

            <td>

                <input type="radio" value="2"  id="option2" name="countType"><label for="option2">(🟨❌󠀩󠀩󠀩󠀩🟨)➕🟨</label>

            </td>
            <td>

                <input type="radio" value="3"  id="option3" name="countType"><label for="option3">(🟨❌󠀩󠀩󠀩󠀩🟨)➖🟨</label>

            </td>
            <td>

                <input type="radio" value="4"  id="option4" name="countType"><label for="option4">(🟨❌🟨)➕🟨➕🟨</label>

            </td>
        </tr>
        <tr class="countTypeTr">


            <td>

                <input type="radio" value="5"  id="option5" name="countType"><label for="option5">🟨❌🟨❌🟨</label>

            </td>
            <td>

                <input type="radio" value="6"  id="option6" name="countType"><label for="option6">🟨❌🟨❌🟨➕🟨</label>

            </td>
            <td>

                <input type="radio" value="7"  id="option7" name="countType"><label for="option7">🟨❌🟨❌🟨➖🟨</label>

            </td>

            <td>
                🟰
                <input type="text" class="numberInput" id="countResult">

            </td>

            <td>

                <button type="button" class="calButton" onclick="getAnswer()">输入数字后点我>_< 🎐 🔭 🔬 💊 🐔</button>

            </td>
        </tr>
    </table>
    <div class="questions">
        <div class="p1">
            <div class="problem">
                <table>
                    <tbody id="answerOutput" class="answer"></tbody>

                </table>

            </div>
        </div>
    </div>
</div>

</body>
<script type="text/javascript">


    function getSelectCountType() {
        const radioList = document.getElementsByName("countType");
        for (let i = 0; i < radioList.length; i++) {
            if (radioList[i].checked) {
                return parseInt(radioList[i].value);
            }
        }
        return 0;
    }

    function getAnswer() {
        var countResult = document.getElementById("countResult").value;
        var selectType = getSelectCountType();
        var returnList = [];
        if (selectType == 0) {
            returnList = countFn0(countResult);
        } else if (selectType == 1) {
            returnList = countFn1(countResult);
        } else if (selectType == 2) {
            returnList = countFn2(countResult);
        } else if (selectType == 3) {
            returnList = countFn3(countResult);
        } else if (selectType == 4) {
            returnList = countFn4(countResult);
        } else if (selectType == 5) {
            returnList = countFn5(countResult);
        } else if (selectType == 6) {
            returnList = countFn6(countResult);
        } else if (selectType == 7) {
            returnList = countFn7(countResult);
        }
        printResult(returnList)

    }

    function printResult(returnList) {
        var returnText = ""
        if (returnList.length == 0) {
            returnText = "无解";
        } else {
            var cloumn = 6;
            var tableStr = "";
            for (var i = 0; i < returnList.length; i += cloumn) {
                tableStr += "<tr>";
                for (var j = 0; j < cloumn; j++) {
                    if ((i + j) < returnList.length) {
                        var item = returnList[i + j];
                        tableStr += "<td style='width: 200px;'>" + item + "</td>";
                    } else {
                        break
                    }
                }
                tableStr += "</tr>";
            }
            returnText = tableStr;
        }
        document.getElementById("answerOutput").innerHTML = returnText;
    }


    function countFn0(t) {

        var e = [];
        for (n = 1; n <= 9; n++)
            for (var i = 1; i <= 9; i++)
                for (var s = 1; s <= 9; s++)
                    for (var o = 1; o <= 9; o++)
                        if (n + i + s + o === parseInt(t)) {
                            if (4 !== new Set([n, i, s, o]).size)
                                continue;
                            if (e.length >= 100) {
                                return e
                            }
                            e.push(n + " + " + i + " + " + s + " + " + o + " = " + t);

                        }
        return e;
    }

    function countFn1(t) {
        var e = [];
        for (n = 1; n <= 9; n++)
            for (var i = 1; i <= 9; i++)
                for (var s = 1; s <= 9; s++)
                    for (var o = 1; o <= 9; o++)
                        if (n + i - s + o === parseInt(t)) {
                            if (4 !== new Set([n, i, s, o]).size)
                                continue;
                            if (e.length >= 100) {
                                return e
                            }
                            e.push(n + " + " + i + " - " + s + " + " + o + " = " + t)
                        }
        return e;
    }

    function countFn2(t) {
        var e = [];
        for (n = 1; n <= 9; n++)
            for (var i = 1; i <= 9; i++)
                for (var s = 1; s <= 9; s++)
                    if (n * i + s === parseInt(t)) {
                        if (3 !== new Set([n, i, s]).size)
                            continue;
                        if (e.length >= 100) {
                            return e
                        }
                        e.push(n + " x " + i + " + " + s + " = " + t)
                    }
        return e;
    }

    function countFn3(t) {
        var e = [];
        for (n = 1; n <= 9; n++)
            for (var i = 1; i <= 9; i++)
                for (var s = 1; s <= 9; s++)
                    if (n * i - s === parseInt(t)) {
                        if (3 !== new Set([n, i, s]).size)
                            continue;
                        if (e.length >= 100) {
                            return e
                        }
                        e.push(n + " x " + i + " - " + s + " = " + t)
                    }
        return e;
    }

    function countFn4(t) {
        var e = [];
        for (n = 1; n <= 9; n++)
            for (var i = 1; i <= 9; i++)
                for (var s = 1; s <= 9; s++)
                    for (var o = 1; o <= 9; o++)
                        if (n * i + s + o === parseInt(t)) {
                            if (4 !== new Set([n, i, s, o]).size)
                                continue;
                            if (e.length >= 100) {
                                return e
                            }
                            e.push("(" + n + " x " + i + ") + " + s + " + " + o + " = " + t)
                        }
        return e;
    }

    function countFn5(t) {
        var e = [];
        for (n = 1; n <= 9; n++)
            for (var i = 1; i <= 9; i++)
                for (var s = 1; s <= 9; s++)
                    if (n * i * s === parseInt(t)) {
                        if (3 !== new Set([n, i, s]).size)
                            continue;
                        if (e.length >= 100) {
                            return e
                        }
                        e.push(n + " x " + i + " x " + s + " = " + t)
                    }
        return e;
    }

    function countFn6(t) {
        var e = [];
        for (n = 1; n <= 9; n++)
            for (var i = 1; i <= 9; i++)
                for (var s = 1; s <= 9; s++)
                    for (var o = 1; o <= 9; o++)
                        if (n * i * s + o === parseInt(t)) {
                            if (4 !== new Set([n, i, s, o]).size)
                                continue;
                            if (e.length >= 100) {
                                return e
                            }
                            e.push("(" + n + " x " + i + " x " + s + ") + " + o + " = " + t)
                        }
        return e;
    }

    function countFn7(t) {
        var e = [];
        for (n = 1; n <= 9; n++)
            for (var i = 1; i <= 9; i++)
                for (var s = 1; s <= 9; s++)
                    for (var o = 1; o <= 9; o++)
                        if (n * i * s - o === parseInt(t)) {
                            if (4 !== new Set([n, i, s, o]).size)
                                continue;
                            if (e.length >= 100) {
                                return e
                            }
                            e.push("(" + n + " x " + i + " x " + s + ") - " + o + " = " + t)
                        }
        return e;
    }
</script>
</html>
